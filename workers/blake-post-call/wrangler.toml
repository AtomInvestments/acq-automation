name = "apg-dashboard"
main = "src/index.ts"
compatibility_date = "2026-05-20"

# Cron Triggers:
#   - Every 15 min: dial batch + dashboard cache refresh + insights change-detection
#     poll + auto-blog cadence check.
#   - Daily at 04:00 UTC (= 12:00 AM EDT / midnight Eastern): end-of-day baseline
#     snapshot of every tracked Insights page, regardless of whether WP modified
#     changed. Gives us a permanent daily history record.
[triggers]
crons = ["*/15 * * * *", "0 4 * * *"]

# KV namespace for dial state — tracks today's count, contact dedupe, anchor.
[[kv_namespaces]]
binding = "DIAL_STATE"
id = "c3e5500651af4248889c8ed69e5ec47b"

# R2 bucket for /websites snapshot PNGs (added 2026-05-29).
#
# Setup (one-time, by Mido):
#   1. Create the bucket:
#        CLOUDFLARE_API_TOKEN=cfut_... ./node_modules/.bin/wrangler r2 bucket create apg-website-snapshots
#   2. Uncomment the binding below.
#   3. Redeploy: CLOUDFLARE_API_TOKEN=cfut_... ./node_modules/.bin/wrangler deploy
#
# Until this is bound, /websites falls back to KV for snapshot storage
# (30-day TTL, ~25 MB hard per-value limit — fine in practice).
#
# [[r2_buckets]]
# binding = "WEBSITES_BUCKET"
# bucket_name = "apg-website-snapshots"

# Secrets needed for the /websites tab (set via `wrangler secret put NAME`):
#   CLARITY_API_TOKEN          Microsoft Clarity Data Export bearer token (set 2026-05-29)
#   CLOUDFLARE_API_TOKEN       Cloudflare API token w/ Workers AI > Browser Rendering > Edit
#                              scope. Optional — falls back to thum.io if absent or if
#                              Browser Rendering isn't opt-in on the account.
#   CLOUDFLARE_ACCOUNT_ID      Account that owns this Worker:
#                              b8fb424de9e19010920dd0cea9545fce

# Worker URL:
#   https://apg-dashboard.mithchell.workers.dev
#
# Naming note: the Worker code in this directory is conceptually the
# "blake-post-call" handler, but the deployed Worker is named "apg-dashboard"
# (renamed from "acq-automation" 2026-06-09 to reflect the multi-pillar
# dashboard scope — Blake + listings + websites + POR + insights). The repo
# stays as AtomInvestments/acq-automation. Later Workers (listing-pipeline,
# slack-listener, sms-reply-handler) live under their own CF projects.
#
# Secrets — set via `wrangler secret put NAME` locally, OR via the
# .github/workflows/deploy-blake-post-call.yml workflow on push:
#   BLAKE_GHL_PIT                  GHL Private Integration Token
#   ELEVENLABS_WEBHOOK_SECRET      HMAC signing secret from ElevenLabs webhook
#
# Local dev (after `wrangler login`):
#   wrangler dev
#
# Deploy:
#   wrangler deploy
