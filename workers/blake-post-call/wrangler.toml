name = "acq-automation"
main = "src/index.ts"
compatibility_date = "2026-05-20"

# Cron Trigger: every 15 min, the scheduled handler attempts a small batch of
# dials respecting the warm-up curve and TCPA call windows. No-op if quota met.
[triggers]
crons = ["*/15 * * * *"]

# KV namespace for dial state — tracks today's count, contact dedupe, anchor.
[[kv_namespaces]]
binding = "DIAL_STATE"
id = "c3e5500651af4248889c8ed69e5ec47b"

# Worker URL:
#   https://acq-automation.mithchell.workers.dev
#
# Naming note: the Worker code in this directory is conceptually the
# "blake-post-call" handler, but the deployed Worker is named "acq-automation"
# to match the CF Workers Builds project name (and to keep one URL for the
# APG automation surface). Later Workers (listing-pipeline, slack-listener,
# sms-reply-handler) live under their own CF projects with their own names.
#
# Secrets — set via `wrangler secret put NAME` locally, OR via the
# .github/workflows/deploy-blake-post-call.yml workflow on push:
#   BLAKE_GHL_PIT                  GHL Private Integration Token
#   ELEVENLABS_WEBHOOK_SECRET      HMAC signing secret from ElevenLabs webhook
#
# Local dev (after `wrangler login`):
#   wrangler dev
#
# Deploy:
#   wrangler deploy
