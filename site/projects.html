<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atom Investments — Projects</title>
<meta property="og:site_name" content="Atom Investments">
<meta property="og:title" content="Atom Investments — Projects">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#0A1F44">
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --ink: #0A1F44; --ink-2: #1A2A4D; --ink-3: #34406B;
  --text: #0E1422; --text-2: #3F4759; --text-3: #6B7388;
  --rule: #E5E7EE; --rule-2: #EFF1F6;
  --surface: #FFFFFF; --surface-2: #F7F8FB; --surface-3: #F1F3F8;
  --gold: #F5C518; --violet: #7C5CD1;
  --violet-soft:#F1ECFB; --gold-soft:#FFF8DA;
  --green: #16A66B; --red: #D93B3B;
  --radius: 6px; --radius-sm: 4px;
  --shadow-1: 0 1px 2px rgba(15,23,42,0.04);
  --shadow-2: 0 8px 24px -8px rgba(15,23,42,0.14), 0 2px 6px -2px rgba(15,23,42,0.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--surface-2); color: var(--text);
  font-family: "Inter", -apple-system, system-ui, sans-serif; font-size: 14px; line-height: 1.55;
  font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; }
@supports (font-variation-settings: normal) { html, body { font-family: "Inter var", "Inter", system-ui, sans-serif; } }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

.nav { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.86); backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid var(--rule); }
.nav-inner { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 28px; height: 56px; padding: 0 28px; }
.brand { display:flex; align-items:center; gap:10px; color:var(--ink); font-weight:600; letter-spacing:-0.01em; font-size:14.5px; }
.brand-mark { width:22px; height:22px; border-radius:5px; background:var(--ink); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
.brand-mark::before, .brand-mark::after, .brand-mark span { content:""; position:absolute; inset:4px; border:1px solid var(--gold); border-radius:50%; opacity:0.85; }
.brand-mark::after { transform: rotate(60deg); } .brand-mark span { transform: rotate(-60deg); }
.brand-mark i { position:absolute; width:4px; height:4px; border-radius:50%; background:var(--gold); left:calc(50% - 2px); top:calc(50% - 2px); }
.brand-name { display:flex; flex-direction:column; line-height:1.15; }
.brand-name .top { font-weight:600; font-size:14px; }
.brand-name .sub { font-size:9.5px; color:var(--text-3); letter-spacing:0.14em; text-transform:uppercase; font-weight:500; }
.tabs { display:flex; gap:2px; flex:1; }
.tab { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:var(--radius-sm); color:var(--text-2); font-weight:500; font-size:13px; transition: background 120ms, color 120ms; }
.tab:hover { background:var(--surface-3); color:var(--text); }
.tab.is-active { background: var(--ink); color:#fff; }
.tab.is-active::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--gold); }
.nav-actions { display:flex; align-items:center; gap:8px; }
.user-pill { display:inline-flex; align-items:center; gap:8px; padding:4px 10px 4px 4px; border:1px solid var(--rule); border-radius:24px; background:var(--surface); font-size:12.5px; font-weight:500; transition: border-color 120ms, box-shadow 120ms; }
.user-pill:hover { border-color:var(--ink-3); box-shadow:var(--shadow-1); }
.avatar { width:24px; height:24px; border-radius:50%; background:var(--ink); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; font-family:"JetBrains Mono", monospace; }
.avatar.adam { background:var(--gold); color:var(--ink); }
.avatar.kabrina { background:var(--violet); }
.avatar.mido { background:var(--ink); }
.avatar.lg { width:40px; height:40px; font-size:13px; }
.shell { max-width: 1320px; margin: 0 auto; padding: 32px 28px 96px; }
.page-head { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:24px; gap:16px; }
.page-title { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; color: var(--text); }
.page-sub { margin: 4px 0 0; color: var(--text-3); font-size: 13.5px; }
.eyebrow { font-family: "JetBrains Mono", monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-3); font-weight: 500; margin-bottom: 6px; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:var(--radius-sm); font-size:13px; font-weight:500; border:1px solid var(--rule); background:var(--surface); color:var(--text); transition: background 120ms, border-color 120ms, transform 120ms; }
.btn:hover { background:var(--surface-3); border-color:var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn-primary { background:var(--ink); color:#fff; border-color:var(--ink); }
.btn-primary:hover { background:#061331; border-color:#061331; }

.project-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
@media (max-width: 760px) { .project-grid { grid-template-columns: 1fr; } }
.proj-card {
  background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 22px; position: relative; overflow: hidden;
  transition: border-color 140ms, transform 140ms, box-shadow 140ms;
  display: flex; flex-direction: column; gap: 14px; cursor: pointer;
}
.proj-card:hover { transform: translateY(-2px); border-color: var(--ink-3); box-shadow: var(--shadow-2); }
.proj-card::before {
  content:""; position:absolute; top:0; left:0; right:0; height:3px;
  background: var(--accent);
}
.proj-card.apg { --accent: var(--gold); }
.proj-card.kin { --accent: var(--violet); }
.proj-card.add { border-style: dashed; align-items: center; justify-content: center; text-align: center; color: var(--text-3); }
.proj-card.add:hover { border-color: var(--ink); color: var(--text); }
.proj-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.proj-mark {
  width: 36px; height: 36px; border-radius: var(--radius);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 14px;
  letter-spacing: -0.02em;
}
.proj-card.apg .proj-mark { background: var(--gold-soft); color: #6B4E00; border: 1px solid #F0DC8F; }
.proj-card.kin .proj-mark { background: var(--violet-soft); color: #4A2D9C; border: 1px solid #D5C7F3; }
.proj-name { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
.proj-full { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.proj-status { display:inline-flex; padding:3px 8px; border-radius:var(--radius-sm); font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; font-family:"JetBrains Mono", monospace; }
.proj-status.active { background:#E5F6EE; color:#0E6B43; }
.proj-status.on-hold { background:var(--surface-3); color: var(--text-2); }
.proj-lede { font-size: 13.5px; color: var(--text-2); line-height: 1.55; }
.proj-stats { display: flex; gap: 24px; padding-top: 12px; border-top: 1px solid var(--rule-2); }
.proj-stat { display: flex; flex-direction: column; }
.proj-stat .v { font-size: 18px; font-weight: 600; font-family: "JetBrains Mono", monospace; letter-spacing: -0.02em; }
.proj-stat .l { font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.14em; font-family: "JetBrains Mono", monospace; margin-top: 2px; }
.proj-team { display: flex; align-items: center; gap: 6px; }
.proj-team .avatar { width: 24px; height: 24px; font-size: 9.5px; border: 2px solid var(--surface); margin-left: -6px; }
.proj-team .avatar:first-child { margin-left: 0; }
.add-plus { width: 44px; height: 44px; border-radius: 50%; border: 1px dashed var(--rule); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 300; color: var(--text-3); margin-bottom: 4px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark"><span></span><i></i></span>
      <span class="brand-name">
        <span class="top">Atom Investments</span>
        <span class="sub">Operations</span>
      </span>
    </a>
    <div class="tabs">
      <a class="tab" href="index.html">Overview</a>
      <a class="tab is-active" href="projects.html">Projects</a>
      <a class="tab" href="roadmap.html">Roadmap</a>
      <a class="tab" href="team.html">Team</a>
    </div>
    <div class="nav-actions">
      <a class="user-pill" href="team.html">
        <span class="avatar mido">MY</span>
        <span>Mido Yasser</span>
      </a>
    </div>
  </div>
</nav>

<main class="shell">

  <div class="page-head">
    <div>
      <div class="eyebrow">Projects · 2 active</div>
      <h1 class="page-title">Projects</h1>
      <p class="page-sub">Every initiative under Atom Investments. Click a card to open its roadmap.</p>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-primary" onclick="newProject()">+ Add Project</button>
    </div>
  </div>

  <div class="project-grid" id="grid"></div>

</main>

<script>
let ROSTER = [];
let PROJECTS = [];

async function load() {
  const [r, p] = await Promise.all([
    fetch("data/roster.json").then(r => r.json()),
    fetch("data/projects.json").then(r => r.json()),
  ]);
  ROSTER = r.people;
  PROJECTS = p.projects;
  render();
}

function render() {
  const grid = document.getElementById("grid");
  const cards = PROJECTS.map(p => {
    const members = (p.members || []).map(id => ROSTER.find(u => u.id === id)).filter(Boolean);
    const avatars = members.map(m => `<span class="avatar ${m.id}" title="${m.name}">${m.initials}</span>`).join("");
    const tasksTotal = (p.tasks || []).length;
    const inflight = (p.tasks || []).filter(t => t.status === "inflight").length;
    const blocked = (p.tasks || []).filter(t => t.status === "blocked").length;
    return `
      <a class="proj-card ${p.id}" href="roadmap.html?p=${p.id}">
        <div class="proj-head">
          <div style="display:flex; gap:14px; align-items:flex-start;">
            <div class="proj-mark">${p.name[0]}</div>
            <div>
              <h3 class="proj-name">${p.name}</h3>
              <div class="proj-full">${p.full_name || ''}</div>
            </div>
          </div>
          <span class="proj-status ${p.status}">${p.status}</span>
        </div>
        <p class="proj-lede">${p.lede || ''}</p>
        <div class="proj-stats">
          <div class="proj-stat"><span class="v">${tasksTotal}</span><span class="l">tasks</span></div>
          <div class="proj-stat"><span class="v">${inflight}</span><span class="l">in flight</span></div>
          <div class="proj-stat"><span class="v">${blocked}</span><span class="l">blocked</span></div>
          <div class="proj-stat" style="margin-left:auto; align-items:flex-end">
            <div class="proj-team">${avatars}</div>
            <span class="l" style="margin-top:6px">team</span>
          </div>
        </div>
      </a>`;
  }).join("");
  const addCard = `
    <div class="proj-card add" onclick="newProject()">
      <div class="add-plus">+</div>
      <div style="font-weight:600; color:var(--text)">Add a new project</div>
      <div style="font-size:12.5px; margin-top:4px">A new initiative under the Atom Investments umbrella</div>
    </div>`;
  grid.innerHTML = cards + addCard;
}

function newProject() {
  const name = prompt("Project name?");
  if (!name) return;
  alert("Project creation is wired to add_project.yml workflow_dispatch (Mido + Adam + Kabrina only) — coming in next session. For now, edit data/projects.json directly.");
}

load().catch(e => {
  document.getElementById("grid").innerHTML = `<div style="padding:40px;color:var(--text-3)">Failed to load: ${e.message}</div>`;
});
</script>
</body>
</html>
