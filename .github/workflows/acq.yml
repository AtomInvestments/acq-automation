name: ACQ Call Recording Automation

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:           # manual trigger from GitHub UI
    inputs:
      backfill_recompute:
        description: 'Re-analyze ARV for ALL stage 1-4 leads (ignore existing ARV). Costs ~$1.50/lead.'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']
      backfill_cap:
        description: 'Max leads to backfill in this run (default 15).'
        required: false
        default: '15'
        type: string

permissions:
  contents: write    # commit processed_contacts.json back to main
  issues:   write    # open an auto-alert issue when this workflow fails

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # NOTE: We previously used actions/cache@v4 to persist
      # processed_contacts.json between runs. That was unreliable for the
      # same reasons sms_state.json bit us — per-ref cache keys, eviction,
      # job isolation. The "Persist processed_contacts.json" step below
      # commits state back to main with [skip ci] (matching sms.yml).
      # First run on a fresh checkout starts from an empty processed map,
      # which acq_automation.py handles natively.

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automation
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          DG_KEY: ${{ secrets.DG_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BACKFILL_RECOMPUTE: ${{ inputs.backfill_recompute || 'false' }}
          BACKFILL_CAP_PER_RUN: ${{ inputs.backfill_cap || '15' }}
        run: python acq_automation.py

      - name: Persist processed_contacts.json back to main
        if: always()
        run: |
          set -e
          if [ ! -f processed_contacts.json ]; then
            echo "No processed_contacts.json present — nothing to persist."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only the state file. Don't drag in any other incidental
          # working-tree changes from the run.
          git add processed_contacts.json
          if git diff --cached --quiet; then
            echo "processed_contacts.json unchanged — no commit needed."
            exit 0
          fi
          git commit -m "chore: update processed_contacts [skip ci]"
          # Pull --rebase in case another scheduled run landed first; retry
          # a couple of times before giving up.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed processed_contacts.json (attempt $i)."
              exit 0
            fi
            echo "Push attempt $i failed; sleeping then retrying..."
            sleep 3
          done
          echo "ERROR: failed to push processed_contacts.json after 3 attempts." >&2
          exit 1

      # Belt-and-suspenders failure notifications:
      #   1. Open a GitHub Issue (works TODAY using the built-in GITHUB_TOKEN
      #      — no external secret required). Mido's notification surface is
      #      GitHub email + mobile push from issue creation.
      #   2. Slack ping, gated on SLACK_WEBHOOK_URL so missing-secret degrades
      #      silently. See SLACK_WEBHOOK_SETUP.md for how to wire it up.
      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          REPO:     ${{ github.repository }}
        run: |
          set -e
          TS=$(date -u +'%Y-%m-%dT%H:%MZ')
          TITLE="[auto-alert] ${WORKFLOW} failed at ${TS}"
          BODY=$(cat <<EOF
          Workflow **${WORKFLOW}** failed.

          - Run: ${RUN_URL}
          - Repo: ${REPO}
          - Time: ${TS}

          This issue was opened automatically by the workflow's failure
          alert step. Close it once the failure is acknowledged or fixed.
          EOF
          )
          gh issue create --repo "${REPO}" \
            --title "${TITLE}" \
            --body  "${BODY}" \
            --label "auto-alert" || true

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":rotating_light: ACQ Call Recording Automation FAILED — ${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL" || true
