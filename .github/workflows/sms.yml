name: ACQ SMS Follow-Up + Dashboard

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min
  # Re-enabled 2026-05-14 after PR #12 (anchor + tag-prebail hotfix) +
  # Phase-2 remediation sweep of the 47 SAFE cohort (commit d1aff6a).
  # Original disable was the 2026-05-08 reply-check regression: Bryan
  # Carestia / Adam Shun / Steven Dadura were re-messaged on May 8 after
  # replying May 7 because stage_entered_at-in-anchor masked the inbound.
  workflow_dispatch:

permissions:
  contents: write    # push to gh-pages branch
  actions:  read     # query other workflow runs for the failure banner
  issues:   write    # open an auto-alert issue when this workflow fails

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # NOTE: We previously used actions/cache@v4 to persist sms_state.json
      # between runs. That was unreliable: the cache key is per-ref and cache
      # eviction / per-job isolation meant some runs read a stale or empty
      # state file, so contacts were re-messaged because sms_count looked
      # like 0. State is now committed back to the repo at the end of the
      # job (see "Persist sms_state.json" step below), which is durable and
      # versioned.

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send SMS follow-ups
        id: sms_send
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          DASHBOARD_SHEET_ID: ${{ secrets.DASHBOARD_SHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python sms_followup.py

      - name: Persist sms_state.json + cadence_health.json back to main
        if: always()
        run: |
          set -e
          # Track which state files were produced this run.
          present=()
          [ -f sms_state.json ]          && present+=("sms_state.json")
          [ -f cadence_health.json ]     && present+=("cadence_health.json")
          [ -f sms_test_state.json ]     && present+=("sms_test_state.json")
          [ -f sms_variant_state.json ]  && present+=("sms_variant_state.json")
          [ -f o2_test_config.json ]     && present+=("o2_test_config.json")
          if [ ${#present[@]} -eq 0 ]; then
            echo "No state files present — nothing to persist."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only the state files. We don't want to drag in any other
          # incidental working-tree changes from the run.
          git add "${present[@]}"
          if git diff --cached --quiet; then
            echo "State unchanged — no commit needed."
            exit 0
          fi
          git commit -m "chore: update sms_state [skip ci]"
          # Pull --rebase in case another scheduled run landed first; retry
          # a couple of times before giving up.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed state (attempt $i)."
              exit 0
            fi
            echo "Push attempt $i failed; sleeping then retrying..."
            sleep 3
          done
          echo "ERROR: failed to push state after 3 attempts." >&2
          exit 1

      - name: Update Google Sheet dashboard
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DASHBOARD_SHEET_ID: ${{ secrets.DASHBOARD_SHEET_ID }}
        run: python dashboard.py

      - name: Regenerate dashboard data (projects.json, roster.json, tasks.json)
        # Vault is local-only; CI emits stub-friendly versions from the legacy
        # projects.json fallback so the new Atom Investments pages (Overview /
        # Projects / Roadmap / Team) render correctly on every deploy.
        run: python vault_to_dashboard.py

      - name: Generate HTML dashboard
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          DASHBOARD_SHEET_ID: ${{ secrets.DASHBOARD_SHEET_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python dashboard_html.py

      - name: Generate Deals dashboard
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
        run: python deals_dashboard.py

      - name: Generate Blake calls dashboard
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          BLAKE_GHL_PIT: ${{ secrets.BLAKE_GHL_PIT }}
        run: python blake_dashboard.py || echo "blake_dashboard.py failed (non-fatal); continuing"

      # Decommissioned 2026-06-12 per APG-Vault/_system/dashboard-rebuild-plan.md §1.
      # Standalone progress.html page was removed; script retained but no longer
      # baked into the dashboard. Re-enable behind a project-overview surface
      # once Session 3 IA reshape lands (APG project's Overview sub-view).
      # - name: Generate Project Tracker dashboard
      #   run: python progress_dashboard.py || echo "progress_dashboard.py failed (non-fatal); continuing"

      # sms-test.html demoted to APG Experiments sub-view per the same plan;
      # baker disabled until Session 3 wires the demoted view.
      # - name: Generate SMS A/B/C test dashboard
      #   run: python sms_test_dashboard.py || echo "sms_test_dashboard.py failed (non-fatal); continuing"

      - name: Refresh site/weekly.html shell with latest layout
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
        run: |
          # Regenerate just the static HTML shell every cron tick so layout
          # changes (modal, refresh button, KPI strip, etc.) propagate without
          # waiting for the Friday weekly snapshot.
          python -c "from weekly_analysis import write_html_shell; write_html_shell()"

      - name: Bundle weekly analysis files into site/
        run: |
          mkdir -p site/weekly
          if [ -d weekly ]; then
            cp -r weekly/* site/weekly/ 2>/dev/null || true
            echo "Copied weekly snapshots into site/weekly/"
            ls -la site/weekly/ || true
          else
            echo "No weekly/ directory yet (first weekly run hasn't fired)."
          fi

      - name: Build priority deals activity feed (notes + calls + slack)
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
        run: python priority_activity.py

      # Bake the latest site/*.html into the Worker's TS bundle so the
      # auth-gated dashboard routes can serve from inline (no github.io proxy).
      # The next CF Workers Build will pick up the regenerated dashboards.ts
      # automatically on push.
      - name: Bake dashboards.ts from site/
        run: python bake_dashboards.py

      - name: Commit baked dashboards.ts back to main
        if: always()
        run: |
          set -e
          if [ ! -f workers/blake-post-call/src/dashboards.ts ]; then
            echo "dashboards.ts not produced — skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/blake-post-call/src/dashboards.ts
          if git diff --cached --quiet; then
            echo "dashboards.ts unchanged — no commit needed."
            exit 0
          fi
          git commit -m "chore: bake dashboards.ts [skip ci]"
          # --autostash: other workflow steps (priority_activity, weekly bundle)
          # leave unstaged files in the worktree which would normally make
          # `git pull --rebase` refuse. Autostash stashes + reapplies them
          # transparently for the rebase only.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed baked dashboards (attempt $i)."
              exit 0
            fi
            echo "Push attempt $i failed; sleeping then retrying..."
            sleep 3
          done
          echo "ERROR: failed to push baked dashboards after 3 attempts." >&2
          exit 1

      - name: Deploy HTML dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Auto: dashboard refresh'

      # Belt-and-suspenders failure notifications:
      #   1. Open a GitHub Issue (works TODAY using the built-in GITHUB_TOKEN
      #      — no external secret required). Mido's notification surface is
      #      GitHub email + mobile push from issue creation.
      #   2. Slack ping, gated on SLACK_WEBHOOK_URL so missing-secret degrades
      #      silently. See SLACK_WEBHOOK_SETUP.md for how to wire it up.
      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          REPO:     ${{ github.repository }}
        run: |
          set -e
          TS=$(date -u +'%Y-%m-%dT%H:%MZ')
          TITLE="[auto-alert] ${WORKFLOW} failed at ${TS}"
          BODY=$(cat <<EOF
          Workflow **${WORKFLOW}** failed.

          - Run: ${RUN_URL}
          - Repo: ${REPO}
          - Time: ${TS}

          This issue was opened automatically by the workflow's failure
          alert step. Close it once the failure is acknowledged or fixed.
          EOF
          )
          gh issue create --repo "${REPO}" \
            --title "${TITLE}" \
            --body  "${BODY}" \
            --label "auto-alert" || true

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":rotating_light: ACQ SMS Follow-Up FAILED — ${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL" || true
