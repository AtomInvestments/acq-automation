name: Deploy blake-post-call Worker

# Deploy the Cloudflare Worker that receives ElevenLabs Blake post-call
# webhooks and writes a backup record to GHL.
#
# Triggers:
#   - Push to main that changes anything under workers/blake-post-call/
#   - Manual dispatch
#
# Required repo secrets (set via gh secret set):
#   CLOUDFLARE_API_TOKEN          token with Workers Scripts:Edit + Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID         Cloudflare account ID
#   BLAKE_GHL_PIT                 GHL Private Integration Token (already set)
#   ELEVENLABS_WEBHOOK_SECRET     HMAC signing secret from ElevenLabs webhook config

on:
  push:
    branches: [main]
    paths:
      - 'workers/blake-post-call/**'
      - '.github/workflows/deploy-blake-post-call.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/blake-post-call
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Push runtime secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # `wrangler secret put` reads from stdin. We push both secrets so the
          # Worker has them available at runtime. These are SEPARATE from
          # GitHub Actions secrets — Cloudflare needs its own copy.
          echo -n "${{ secrets.BLAKE_GHL_PIT }}" | npx wrangler secret put BLAKE_GHL_PIT
          echo -n "${{ secrets.ELEVENLABS_WEBHOOK_SECRET }}" | npx wrangler secret put ELEVENLABS_WEBHOOK_SECRET

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Print Worker URL
        run: |
          echo "Worker should be live at:"
          echo "  https://blake-post-call.<your-cf-subdomain>.workers.dev"
          echo "  Webhook endpoint: POST /webhook"
          echo "  Health check:     GET  /health"
